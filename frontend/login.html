<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Login — RideShare</title>
  <!-- Google Fonts for clean modern typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/style.css" />
  <style>
    :root {
      --glass-bg: rgba(255, 255, 255, 0.07);
      --glass-border-light: rgba(255, 255, 255, 0.32);
      --glass-border-subtle: rgba(255, 255, 255, 0.08);
      --input-glass: rgba(15, 23, 42, 0.45);
      --text-primary: #f8fafc;
      --text-secondary: rgba(226, 232, 240, 0.72);
      --accent-primary: #38bdf8;
      --accent-secondary: #818cf8;
      --accent-glow: rgba(56, 189, 248, 0.45);
      --danger-glass: rgba(239, 68, 68, 0.18);
      --danger-border: rgba(248, 113, 113, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      background-color: #060913;
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
    }

    /* Animated Ambient Background Orbs for Glass Refraction */
    .ambient-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      background: 
        radial-gradient(circle at 15% 15%, rgba(14, 165, 233, 0.18), transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(139, 92, 246, 0.18), transparent 50%),
        #060913;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(75px);
      opacity: 0.75;
      animation: floatOrb 18s ease-in-out infinite alternate;
    }

    .orb-1 {
      width: 420px;
      height: 420px;
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      top: -10%;
      left: 12%;
    }

    .orb-2 {
      width: 460px;
      height: 460px;
      background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
      bottom: -12%;
      right: 10%;
      animation-delay: -6s;
    }

    .orb-3 {
      width: 280px;
      height: 280px;
      background: linear-gradient(135deg, #2dd4bf 0%, #3b82f6 100%);
      top: 42%;
      left: 52%;
      transform: translate(-50%, -50%);
      opacity: 0.45;
      animation-duration: 12s;
    }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(35px, -25px) scale(1.08); }
      100% { transform: translate(-25px, 30px) scale(0.95); }
    }

    #navbar {
      position: relative;
      z-index: 10;
    }

    /* Main Layout */
        .auth-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
      position: relative;
      z-index: 1;
      background: transparent;
    }

    /* Refractive Glass Card */
    .auth-card {
      position: relative;
      width: 100%;
      max-width: 440px;
      padding: 2.75rem 2.5rem;
      border-radius: 28px;
      background: linear-gradient(
        145deg,
        rgba(255, 255, 255, 0.13) 0%,
        rgba(255, 255, 255, 0.04) 55%,
        rgba(255, 255, 255, 0.08) 100%
      );
      backdrop-filter: blur(28px) saturate(190%);
      -webkit-backdrop-filter: blur(28px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow:
        0 30px 60px -12px rgba(0, 0, 0, 0.65),
        inset 0 1.5px 1px 0 var(--glass-border-light),
        inset 1.5px 0 1px 0 rgba(255, 255, 255, 0.18),
        inset 0 -1.5px 2px 0 rgba(56, 189, 248, 0.18);
      overflow: hidden;
      animation: cardAppear 0.55s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Dynamic Cursor Spotlight Refraction */
    .auth-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(
        480px circle at var(--mouse-x, 20%) var(--mouse-y, 15%),
        rgba(255, 255, 255, 0.13),
        transparent 45%
      );
      pointer-events: none;
      z-index: 0;
    }

    /* Top Prismatic Specular Highlight Line */
    .auth-card::after {
      content: "";
      position: absolute;
      top: 0;
      left: 12%;
      right: 12%;
      height: 1px;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.75),
        rgba(56, 189, 248, 0.65),
        rgba(168, 85, 247, 0.65),
        transparent
      );
      z-index: 1;
    }

    .auth-card > * {
      position: relative;
      z-index: 2;
    }

    @keyframes cardAppear {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Brand Badge */
    .brand-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 0.85rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.09);
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25);
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      color: #bae6fd;
      margin-bottom: 1.25rem;
    }

    .brand-pill svg {
      width: 15px;
      height: 15px;
      stroke: #38bdf8;
    }

    .auth-card h1 {
      font-size: 1.9rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      margin-bottom: 0.4rem;
      background: linear-gradient(135deg, #ffffff 30%, #bae6fd 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .auth-sub {
      color: var(--text-secondary);
      font-size: 0.95rem;
      margin-bottom: 1.65rem;
    }

    /* Error Box */
    .auth-error {
      display: none;
      padding: 0.8rem 1rem;
      margin-bottom: 1.25rem;
      border-radius: 14px;
      background: var(--danger-glass);
      border: 1px solid var(--danger-border);
      backdrop-filter: blur(12px);
      color: #fecaca;
      font-size: 0.88rem;
      line-height: 1.4;
    }

    .auth-error:not(:empty) {
      display: block;
    }

    /* Form Fields */
    .field {
      margin-bottom: 1.25rem;
    }

    .field label {
      display: block;
      font-size: 0.84rem;
      font-weight: 500;
      color: rgba(241, 245, 249, 0.88);
      margin-bottom: 0.5rem;
      letter-spacing: 0.01em;
    }

    .input-glass-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 1rem;
      width: 18px;
      height: 18px;
      color: rgba(148, 163, 184, 0.85);
      pointer-events: none;
      transition: color 0.25s ease;
    }

    .field input {
      width: 100%;
      padding: 0.85rem 2.75rem 0.85rem 2.75rem;
      font-size: 0.95rem;
      font-family: inherit;
      color: var(--text-primary);
      background: var(--input-glass);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 14px;
      outline: none;
      box-shadow: 
        inset 0 2px 4px rgba(0, 0, 0, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
      transition: all 0.25s ease;
    }

    .field input::placeholder {
      color: rgba(148, 163, 184, 0.55);
    }

    .field input:focus {
      background: rgba(15, 23, 42, 0.65);
      border-color: rgba(56, 189, 248, 0.65);
      box-shadow: 
        0 0 0 4px rgba(56, 189, 248, 0.16),
        inset 0 1px 2px rgba(255, 255, 255, 0.15);
    }

    .input-glass-wrap:focus-within .input-icon {
      color: var(--accent-primary);
    }

    /* Show/Hide Password Button */
    .pwd-toggle {
      position: absolute;
      right: 0.8rem;
      background: none;
      border: none;
      color: rgba(148, 163, 184, 0.8);
      cursor: pointer;
      padding: 0.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      transition: color 0.2s ease, background 0.2s ease;
    }

    .pwd-toggle:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
    }

    /* Refractive Primary Button */
    .btn.btn-block {
      width: 100%;
      margin-top: 0.5rem;
      padding: 0.92rem 1.25rem;
      border-radius: 14px;
      font-family: inherit;
      font-size: 0.98rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      color: #ffffff;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.35);
      background: linear-gradient(
        135deg,
        rgba(56, 189, 248, 0.85) 0%,
        rgba(99, 102, 241, 0.85) 100%
      );
      box-shadow:
        0 10px 25px -5px rgba(56, 189, 248, 0.45),
        inset 0 1px 1px rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(12px);
      transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
    }

    .btn.btn-block:hover {
      transform: translateY(-1.5px);
      filter: brightness(1.08);
      box-shadow:
        0 16px 32px -6px rgba(56, 189, 248, 0.6),
        inset 0 1px 1px rgba(255, 255, 255, 0.7);
    }

    .btn.btn-block:active {
      transform: translateY(0);
    }

    /* Register Link */
    .auth-alt {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.9rem;
      color: var(--text-secondary);
    }

    .auth-alt a {
      color: #7dd3fc;
      font-weight: 600;
      text-decoration: none;
      transition: color 0.2s ease, text-shadow 0.2s ease;
    }

    .auth-alt a:hover {
      color: #ffffff;
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.7);
    }

    /* Refractive Demo Logins Panel */
    .demo-logins {
      margin-top: 1.75rem;
      padding: 1rem 1.1rem;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.045);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.15);
      font-size: 0.82rem;
      color: var(--text-secondary);
    }

    .demo-logins strong {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #e2e8f0;
      font-size: 0.76rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 0.65rem;
    }

    .demo-logins strong span {
      font-weight: 400;
      text-transform: none;
      letter-spacing: 0;
      color: #7dd3fc;
      font-size: 0.75rem;
    }

    .demo-chips {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }

    .demo-chip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      text-align: left;
      padding: 0.55rem 0.75rem;
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.09);
      color: #cbd5e1;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.78rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .demo-chip:hover {
      background: rgba(56, 189, 248, 0.15);
      border-color: rgba(56, 189, 248, 0.45);
      color: #ffffff;
      transform: translateX(2px);
    }

    .demo-chip-badge {
      font-family: 'Inter', sans-serif;
      font-size: 0.7rem;
      padding: 0.15rem 0.45rem;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.1);
      color: #bae6fd;
    }

    @media (max-width: 480px) {
      .auth-card {
        padding: 2rem 1.5rem;
        border-radius: 22px;
      }
      .auth-card h1 {
        font-size: 1.65rem;
      }
    }
  </style>
</head>
<body>
  <!-- Ambient Background for Refractive Glass Effect -->
  <div class="ambient-canvas" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <header id="navbar"></header>

  <main class="auth-wrap">
    <div class="auth-card" id="glassCard">
      <div class="brand-pill">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2" />
          <circle cx="7" cy="17" r="2" />
          <path d="M9 17h6" />
          <circle cx="17" cy="17" r="2" />
        </svg>
        RideShare Portal
      </div>

      <h1>Welcome back</h1>
      <p class="auth-sub">Log in to post or find rides.</p>

      <div class="auth-error" id="authError"></div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <div class="input-glass-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect width="20" height="16" x="2" y="4" rx="2" />
              <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
            </svg>
            <input id="email" type="email" placeholder="you@example.com" autocomplete="email" required />
          </div>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="input-glass-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
              <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
            <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" required />
            <button type="button" class="pwd-toggle" id="togglePwd" aria-label="Toggle password visibility">
              <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>
        </div>

        <button class="btn btn-block" id="loginBtn" type="submit">Login</button>
      </form>

      <p class="auth-alt">New here? <a href="register.html">Create an account</a></p>

      <div class="demo-logins">
        <strong>
          Demo logins
          <span>Click to auto-fill</span>
        </strong>
        <div class="demo-chips">
          <button type="button" class="demo-chip" data-email="demo1@example.com" data-pass="password123">
            <span>demo1@example.com / password123</span>
            <span class="demo-chip-badge">Fill</span>
          </button>
          <button type="button" class="demo-chip" data-email="demo2@example.com" data-pass="password123">
            <span>demo2@example.com / password123</span>
            <span class="demo-chip-badge">Fill</span>
          </button>
        </div>
      </div>
    </div>
  </main>

  <div id="toasts"></div>

  <!-- UI Enhancement Script (Refractive spotlight + Demo auto-fill + Password toggle) -->
  <script>
    (() => {
      const card = document.getElementById('glassCard');
      const emailInput = document.getElementById('email');
      const passInput = document.getElementById('password');
      const togglePwd = document.getElementById('togglePwd');

      // Refractive cursor light tracking
      if (card) {
        card.addEventListener('mousemove', (e) => {
          const rect = card.getBoundingClientRect();
          const x = ((e.clientX - rect.left) / rect.width) * 100;
          const y = ((e.clientY - rect.top) / rect.height) * 100;
          card.style.setProperty('--mouse-x', `${x}%`);
          card.style.setProperty('--mouse-y', `${y}%`);
        });
      }

      // Show/Hide Password toggle
      if (togglePwd && passInput) {
        togglePwd.addEventListener('click', () => {
          const isPwd = passInput.type === 'password';
          passInput.type = isPwd ? 'text' : 'password';
          togglePwd.style.color = isPwd ? '#38bdf8' : 'rgba(148, 163, 184, 0.8)';
        });
      }

      // Click-to-fill Demo Logins
      document.querySelectorAll('.demo-chip').forEach((chip) => {
        chip.addEventListener('click', () => {
          emailInput.value = chip.dataset.email;
          passInput.value = chip.dataset.pass;
          emailInput.dispatchEvent(new Event('input', { bubbles: true }));
          passInput.dispatchEvent(new Event('input', { bubbles: true }));
          emailInput.focus();
        });
      });
    })();
  </script>

  <script type="module" src="js/login.js"></script>
</body>
</html>
